<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Way of Ping V14.0 - Swedish Pilot Test Harness</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger-red: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent-cyan); }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button {
            background-color: var(--border-color);
            color: var(--text-main);
            border: 1px solid var(--accent-blue);
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover { background-color: var(--accent-blue); color: #fff; }
        .output-box {
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--accent-green);
            white-space: pre-wrap;
            min-height: 140px;
        }
    </style>

    <!-- Privacy-friendly analytics by Plausible -->
    <script defer data-domain="johnnytran0421-cloud.github.io" src="https://plausible.io/js/script.js"></script>
</head>
<body>
    <div class="container">
        <h1>The Way of Ping - Swedish Pilot Test Harness</h1>
        <p>Chọn công ty niêm yết tại Thụy Điển để chạy qua private test harness:</p>
        
        <div class="btn-group">
            <button onclick="runTest('VOLV_B', 'Volvo AB', 'OMX Stockholm', '215.40 SEK', 'Industrial Core')">1. Volvo AB (VOLV B)</button>
            <button onclick="runTest('ERIC_B', 'Ericsson', 'OMX Stockholm', '68.25 SEK', 'Telecom Infrastructure')">2. Ericsson (ERIC B)</button>
            <button onclick="runTest('HM_B', 'H&M Hennes & Mauritz', 'OMX Stockholm', '178.90 SEK', 'Retail Enterprise')">3. H&M (HM B)</button>
        </div>

        <div id="output" class="output-box">[SYSTEM READY] Chờ lệnh chọn công ty để nạp dữ liệu phân tích thực tế từ OMX Stockholm...</div>
    </div>

    <script>
        function runTest(ticker, name, exchange, price, sector) {
            const timestamp = new Date().toISOString();
            const data = {
                status: "VERIFIED",
                ticker: ticker,
                company: name,
                exchange: exchange,
                marketPrice: price,
                sector: sector,
                dataSource: "OMX Stockholm Public Feed (Simulated Secure Feed)",
                pipelineExecution: "Deterministic Pass",
                timestamp: timestamp,
                engineVersion: "V14.0-pilot"
            };
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
            
            if(window.plausible) {
                window.plausible('TestRun', { props: { ticker: ticker } });
            }
        }
    </script>
</body>
</html>
