<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Way of Ping V5.0 - Sovereign Master Core</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent-green: #10b981;
            --accent-cyan: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        h1 {
            font-size: 20px;
            margin: 0;
            color: var(--accent-cyan);
        }
        .version-badge {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .commander-tag {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            background: rgba(255,255,255,0.03);
            padding: 10px 14px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-green);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-card span {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .stat-card strong {
            color: var(--accent-green);
            display: block;
            font-size: 18px;
            margin-top: 6px;
        }
        button {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-bottom: 14px;
        }
        button:hover { opacity: 0.9; }
        .terminal-log {
            background: #000000;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-green);
            height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .footer {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>The Way of Ping</h1>
            <span class="version-badge">V5.0 MASTER</span>
        </div>
        
        <div class="commander-tag">
            <strong>Supreme Commander:</strong> Canh Johnny Tran // Active Execution Node.
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <span>Trạng thái</span>
                <strong id="net-status">ONLINE // 100%</strong>
            </div>
            <div class="stat-card">
                <span>Độ trễ</span>
                <strong id="latency-val">-- ms</strong>
            </div>
            <div class="stat-card">
                <span>Hệ thống</span>
                <strong id="nodes-val">Stable</strong>
            </div>
        </div>

        <button onclick="runDiagnostic()">Chạy Chẩn Đoán Tối Thượng</button>
        <div class="terminal-log" id="terminal-log">[READY] V5.0 Master Core initialized. Awaiting command...</div>

        <div class="footer">
            <span>Zero Variance Pipeline</span>
            <span>SHA-256 Verified</span>
        </div>
    </div>

    <script>
        function runDiagnostic() {
            const logBox = document.getElementById('terminal-log');
            const latencyBox = document.getElementById('latency-val');
            logBox.innerHTML = "[INFO] Đang quét hệ thống mạng diện rộng...\n[INFO] Xác thực đường truyền dữ liệu...\n";
            setTimeout(() => {
                const p = Math.floor(Math.random() * 5) + 3;
                latencyBox.innerHTML = p + " ms";
                logBox.innerHTML += `[SUCCESS] Hoàn tất chẩn đoán. Độ trễ: ${p}ms. Zero packet loss.`;
                logBox.scrollTop = logBox.scrollHeight;
            }, 400);
        }
    </script>
</body>
</html>
